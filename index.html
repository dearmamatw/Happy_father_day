<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>悄悄話佈告欄｜媽媽，你睡了嗎？</title>
<meta name="description" content="父親節前，一群媽媽寫下想對隊友說的話。翻到背面，看看她也記得什麼。">
<style>
:root{--deep:#070D1E;--paper:#EDE3CC;--back:#F6E4B8;--gold:#F1CB5C;--ink:#2A2418}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--deep);color:#EDE7D6;font-family:"Noto Serif TC","Songti TC",serif;overflow:hidden}
.sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 95% 60% at 50% -18%,#1D2A50 0%,transparent 62%),linear-gradient(180deg,#0E1834 0%,#070D1E 100%)}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;background:rgba(241,203,92,.5);border-radius:50%;animation:tw 4.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.85}}
.moon{position:fixed;top:5vh;right:5vw;width:54px;height:54px;z-index:2;border-radius:50%;box-shadow:inset -15px 4px 0 0 var(--gold);opacity:.75;pointer-events:none}

.stage{position:relative;z-index:3;height:100vh;display:flex;flex-direction:column;padding:3.6vh 4vw 2vh}
.head{flex:0 0 auto;max-width:52em}
.eyebrow{font-size:.68rem;letter-spacing:.32em;color:var(--gold);font-family:"Noto Sans TC",sans-serif;margin-bottom:1rem}
h1{font-size:clamp(1.02rem,1.95vw,1.58rem);font-weight:500;line-height:1.62;color:#FBF3DD;margin-bottom:.7rem;
  text-wrap:balance;word-break:keep-all;line-break:strict}
.ph{display:inline-block}
h1 em{font-style:normal;color:var(--gold)}
.lede{font-size:.85rem;color:#9EAAC8;line-height:1.8;max-width:40em}
.turn{margin-top:.55rem;font-family:"Noto Sans TC",sans-serif;font-size:.74rem;color:var(--gold);letter-spacing:.05em}
.counter{margin-top:.45rem;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;color:#6B7796;letter-spacing:.04em;min-height:1.2em;transition:color .4s}
.counter.show{color:var(--gold)}

.wall{position:relative;flex:1 1 auto;margin-top:1.6vh}
.note{position:absolute;background:var(--paper);color:var(--ink);border:none;padding:.85rem .8rem;
  border-radius:1px;cursor:pointer;font-family:inherit;text-align:left;
  box-shadow:0 8px 18px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.3,.9,.4,1),box-shadow .3s;
  overflow:hidden;display:flex;align-items:center;min-height:120px}
.note::before{content:'';position:absolute;left:0;right:0;bottom:0;height:20px;pointer-events:none;
  background:linear-gradient(180deg,rgba(237,227,204,0) 0%,var(--paper) 88%)}
.note span{font-size:.75rem;line-height:1.85;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note:hover,.note:focus-visible{transform:translateY(-9px) scale(1.06) rotate(0deg)!important;box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:60;outline:none}
.note:focus-visible{box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 2px var(--gold)}
.tape{position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-2deg);width:38px;height:13px;background:rgba(241,203,92,.24);border-radius:1px}

.foot{flex:0 0 auto;padding-top:1.2vh;font-family:"Noto Sans TC",sans-serif;font-size:.65rem;color:#5B6786;line-height:1.7}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,8,18,.86);backdrop-filter:blur(7px);
  display:flex;align-items:center;justify-content:center;padding:6vh 5vw;opacity:0;pointer-events:none;transition:opacity .32s}
.overlay.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(560px,100%);perspective:1400px}
.cardinner{position:relative;width:100%;min-height:340px;transition:transform .7s cubic-bezier(.36,.12,.2,1);transform-style:preserve-3d}
.card.flipped .cardinner{transform:rotateY(180deg)}
.cface{backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:2.6rem 2.4rem;border-radius:2px;box-shadow:0 26px 60px rgba(0,0,0,.6);color:var(--ink);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  display:flex;min-height:340px;max-height:70vh}
.cfront{position:relative;background:var(--paper)}
.cback{position:absolute;inset:0;background:var(--back);transform:rotateY(180deg)}
.cface::-webkit-scrollbar{width:4px}
.cface::-webkit-scrollbar-thumb{background:rgba(7,13,30,.2);border-radius:2px}
.cface p{font-size:.98rem;line-height:2.05;white-space:pre-wrap;width:100%;margin:auto 0}
.flip{position:absolute;left:50%;bottom:-3.4rem;transform:translateX(-50%);background:none;border:1px solid rgba(241,203,92,.4);
  color:var(--gold);font-family:"Noto Sans TC",sans-serif;font-size:.78rem;letter-spacing:.12em;
  padding:.5rem 1.5rem;border-radius:999px;cursor:pointer;transition:all .25s;white-space:nowrap}
.flip:hover{background:var(--gold);color:var(--deep)}
.close{position:fixed;top:3vh;right:4vw;background:none;border:none;color:#8C97B4;font-size:1.9rem;cursor:pointer;line-height:1;padding:.4rem}
.close:hover{color:var(--gold)}

@media(min-width:821px) and (max-width:1180px){
  h1{font-size:1.22rem}
  .lede{font-size:.8rem}
  .note span{font-size:.72rem}
}
@media(max-width:820px){
  body{overflow:auto}
  .stage{height:auto;min-height:100vh;padding:5vh 6vw 6vh}
  h1{font-size:1.08rem;line-height:1.75}
  h1 .ph{display:block}
  .wall{height:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:11px;margin-top:2.4rem}
  .note{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:122px!important;padding:.8rem .78rem;transform:none!important}
  .note:hover{transform:translateY(-4px)!important}
  .cface{padding:2rem 1.6rem;min-height:300px}
  .cface p{font-size:.9rem;line-height:1.95}
  .flip{bottom:-3rem}
}
@media(prefers-reduced-motion:reduce){.cardinner{transition:none}.star{animation:none}.note{transition:none}}
</style>

html:not(#_) body{color:#1A2547}
.sky,.stars{display:none}
.moon{box-shadow:inset -15px 4px 0 0 #1A2547;opacity:.9}
.dm-logo{margin-bottom:1.1rem}
.dm-logo img{width:clamp(130px,13vw,180px)}
.eyebrow{font-weight:700;color:#1A2547}
h1{color:#1A2547;font-weight:900}
h1 em{color:#1A2547;background:#FDF6EF;padding:0 .25em;border-radius:.25em}
.lede{color:rgba(26,37,71,.85)}
.turn{color:#1A2547;font-weight:700}
.counter{color:rgba(26,37,71,.6)}
.counter.show{color:#1A2547}
.note{border-radius:6px;box-shadow:0 8px 18px rgba(26,37,71,.18)}
.note:hover,.note:focus-visible{box-shadow:0 18px 34px rgba(26,37,71,.28)}
.note:focus-visible{box-shadow:0 18px 34px rgba(26,37,71,.28),0 0 0 2px #1A2547}
.tape{background:rgba(26,37,71,.14)}
.foot{color:rgba(26,37,71,.72)}
.overlay{background:rgba(26,37,71,.86)}
.cface{border-radius:18px}
.flip{border-color:rgba(255,255,255,.55);color:#fff}

.close{color:#fff}
.close:hover{color:#EFB64E}

    <div class="eyebrow">父親節特輯</div>
    <h1><span class="ph">爸爸辛苦了！</span><span class="ph">我們看見的，</span><em class="ph">不只有付清帳單而已。</em></h1>
    <p class="lede">父親節前，我們請一群媽媽寫下想對隊友說的話。可以吐苦水，也可以說謝謝。我以為會收到滿滿的抱怨，結果不是。</p>
    <p class="turn">點開一張便條紙，記得翻到背面看看。</p>
    <p class="counter" id="counter">正在數這些真心話被看見幾次⋯</p>

<script>
const P=[{"sour": "", "care": "在懷孕的過程中，你總是把我放在第一個順位，包辦所有家事，照顧我的身心健康。\n\n希望寶寶出來以後，我們還是跟現在一樣，一起合作，當個快樂的父母。"}, {"sour": "下班回來只想休息、打電動。有時候讓你顧小孩，孩子明明才剛睡醒沒多久，你就想用奶嘴安撫他再睡，沒有陪他玩一下。\n\n吃飯配飲料看手機，我不想讓孩子模仿，所以每次都要我糾正。\n\n有時候請你倒個垃圾、顧一下小孩、晾個衣服，你會愣一下。咦，這不是「應該」的嗎？\n\n可是我顧了一整天，也真的只是想喘一口氣。", "care": "我知道你上班很累，早起又要通勤，所以我也常常站在你的角度想。\n\n你回家會陪我們一起做任何事，跟孩子互動的樣子，真是最美的畫面。\n\n我常常想跟你說：有你真好，你辛苦了。"}, {"sour": "18 個月，我們迎來了第一場仗，腸病毒。\n\n我一直把孩子顧得好好的，結果是爸爸帶回來的。\n\n那幾天，真的辛苦我跟女兒了。", "care": "當媽媽 18 個月，雖然有吵不完的架，但謝謝你總是願意聆聽我的心聲。\n\n我想，這是最好的解藥。"}, {"sour": "我知道老大在你心中的位置很特別。\n\n但我也希望老二能感受到那份「爸爸無條件的愛與包容」。\n\n如果你能給他一樣多的耐心，他們之間的感情也會更緊密。", "care": "謝謝你每天無怨無悔地打拼，為我們撐起這個家。\n\n因為有你的付出，我們才能心無旁騖地生活，甚至隨心所欲地去走走看看。\n\n這一切的美好，都是因為有你在前面默默守護著。"}, {"sour": "你睡著後聽到寶寶哭，睜開眼第一句話就是對我不耐煩。\n\n可不可以先問問發生什麼事？\n\n那時候我也很慌。", "care": "謝謝你每天無怨無悔地努力，為我們撐起這個溫暖無憂的家。\n\n真的辛苦你了。"}, {"sour": "", "care": "你還是很棒啦。"}, {"sour": "即使結婚有小孩了，有時候你的想法還是跟單身時一樣，想做什麼就做什麼。\n\n我自己出門一下下就會想孩子有沒有被照顧好，出門前總是要詳細交代，一個沒說清楚就會漏掉。\n\n我知道你也在學，只是那份不放心，我還沒辦法放下。", "care": "可以感受到你很愛我。\n\n我對自己的外型很不滿意，但你常常一直誇我。\n\n我知道，你想讓我們過好一點的生活，你已經盡力了。"}, {"sour": "累的時候你比較容易生氣，對孩子也是，話說出口就沒那麼小心了。\n\n我知道你不是故意的。\n\n只是孩子還小，他會把那些話記很久。", "care": "默默把家事做完。"}, {"sour": "孩子出生以後，你的眼裡好像只剩下他。\n\n我知道那是因為你愛他。\n\n只是偶爾，我也會想被你看見一下。", "care": "你付出很多時間陪伴這個家。"}, {"sour": "產後不到一個星期，我身體還沒恢復，原本希望你自己出去買飯，你說不方便一個人去。\n\n我怕你餓，只好拖著還在疼的身體陪你出門。\n\n那時候我才發現，在我最需要被照顧的時候，我還是在照顧你。\n\n不知道有沒有人也這樣：明明有隊友，卻總覺得自己一個人在努力。", "care": "雖然最近常常抱怨你，但其實我知道，你也有在乎我的地方。\n\n謝謝你總是願意下廚，讓我和孩子每天都能吃到熱騰騰的飯菜。\n\n也謝謝你，即使知道行動很容易被我發現，還是努力想製造驚喜。那束你親手做的花，我到現在都還記得。\n\n我知道你是個善良的人，也相信你愛我和孩子。"}, {"sour": "你出差一次就是兩三個月。\n\n那段時間我一個人帶兩個，真的很不容易。\n\n我知道你也是為了這個家。只是有些夜裡，會特別希望你在。", "care": "你常常說「辛苦了、還好有你、你把家裡照顧得很好」。\n\n也常常抱抱我。"}, {"sour": "隊友最近突然很 carry。\n\n我想了一下。啊，原來是父親節要到了。\n\n不過沒關係，我還是收下了。", "care": "你會注意我喜歡吃的東西，幫我買回來。\n\n謝謝你一起把這個家撐起來，陪伴孩子們這段特別艱辛的日子。\n\n以後我退休也要靠你養了。"}, {"sour": "其實你已經做得很多了。\n\n只是有時候我會想不通：為什麼我可以不顧一切地去做，而你總是先想到那些做不到的理由？\n\n我知道那也是一種謹慎。只是那時候，我很希望你能跟我一起往前衝一次。", "care": "謝謝你很願意分擔家務。\n\n在帶小孩這件事上，你也很用心、很願意一起改進。"}, {"sour": "跟你分享事情的時候，經常是已讀。\n\n我知道你有在聽，只是沒有回應。\n\n有時候我要的不是解決方法，只是一句「我知道了」。", "care": "晚上我還在忙的時候，你會去幫孩子泡奶、刷牙、講故事、陪睡，還會倒垃圾、洗衣服。\n\n謝謝你主動一起分擔，很貼心喔。"}, {"sour": "我比較幸運，有一個很有肩膀的隊友。\n\n沒有滿分的原因是，你有時候有點笨拙。\n\n但也許是我太細膩、太有效率了。這大概就是一種互補吧。", "care": "你不管在小孩、家事上都蠻盡心盡力的，其實我都看在眼裡。\n\n這幾年我覺得自己很幸運，也很知足。\n\n謝謝你雖然笨拙，但很用心。"}, {"sour": "產檢的時候，你一直在講工作、一直在回訊息。\n\n那半個小時，我很希望你能跟我一起，好好聽聽寶寶的聲音。", "care": "雖然你總是說很忙，但還是會陪我來產檢。\n\n快到預產期的時候，你突然打電話說：「我現在在外縣市，如果你要生了怎麼辦？」\n\n我哭笑不得，怎麼這麼晚開竅。"}, {"sour": "總是要挑孩子最難搞的時候出門運動。我知道運動是好事，只是每次聽到你要出門，心裡都會有點失落。\n\n還有那個吃完的碗、喝過的杯子，可以順手洗嗎？放著說等一下洗，最後常常還是我洗。\n\n然後，好像很久，沒有兩個人的小旅行了。", "care": "你回家前總是會私訊問我有沒有想吃的，可以順路帶回來，這個小舉動就非常溫暖。\n\n我上夜班的時候，你會特地到醫院等我下班，再一起回家。\n\n親愛的爸爸，育兒路上很多事情都是第一次挑戰，但慶幸的是我們都有努力溝通。\n\n謝謝你默默守護著我們。希望未來回頭看這些點滴，我們能笑著說出當初是怎麼撐過來的。"}, {"sour": "孩子發脾氣的時候，可以不要用吼的嗎？\n\n那樣其實幫不上忙。\n\n處理完孩子的情緒，還要處理你的。那時候我真的很想，有誰來處理一下我的。", "care": "謝謝你提供我的家人專業又親切的建議。\n\n讓我不用休息時間還要幫家人操心，分擔了我不太想做的事。"}, {"sour": "到處是玩具、碗盤沒洗、家裡亂到不行的時候，常常要我開口你才會動。\n\n孩子黏著我的那段時間，你其實可以順手整理一下。\n\n我知道你也累了一天。只是我也想有人接手一下。", "care": "因為工作的關係，你有三分之一的時間要待機。\n\n你會盡量在那天早點回來，晚上陪孩子睡。如果那天幸運沒有被叫醒，有時反而是我睡得最好的時候。\n\n假日我出勤時你會帶孩子去公園，孩子覺得跟你一起是好玩的，會乖乖跟我說拜拜。"}, {"sour": "懷孕全身痠痛，請你幫我按摩。\n\n你按一下就說手很痠，叫我去給專業的按。\n\n其實我要的不是按摩技術，只是想被你碰一碰。", "care": "你上班其實也很辛苦，下班還要面對一個孕婦的身心狀況。\n\n大家總說懷孕的媽媽很辛苦，但在我看來，盡責的隊友也不輕鬆。\n\n謝謝你在孕期努力做好一個老公的角色。"}, {"sour": "孕後期半夜起來上廁所，看到你睡得那麼熟，還打著呼。\n\n那一刻真的有點想把你搖醒。\n\n不過看你白天也累成那樣，我又下不了手。", "care": "孕後期會有假性宮縮，你看到我痛苦，你的心情也變得很不好。\n\n謝謝你每次產檢即使工作很忙，都會排開時間陪我。"}, {"sour": "你對每件事情都很緊張，一直問我怎麼辦。\n\n可是我也是第一次當媽媽，內心也很無措。\n\n有時候我也希望，有個人可以告訴我怎麼辦。", "care": "你在外面覓食，每次經過我愛吃的店，總會直接買回來。\n\n第一個只考慮我喜不喜歡，而不是能不能吃。\n\n謝謝你總是先關心我，謝謝你願意為了我們奔波，還說這是你願意的。"}, {"sour": "孩子哭鬧的時候，先別急著說教。\n\n他可能只是不舒服、想睡、肚子餓。\n\n在那個當下講道理，其實我們兩個都會更累。", "care": "謝謝你也會一起想假日要帶寶寶去哪裡玩。\n\n就算天氣炎熱，也會帶孩子出去曬曬太陽、走一走。"}, {"sour": "我本來就偏愛哭，懷孕初期情緒更敏感，三不五時就會掉眼淚。\n\n你看到我哭，總是一直問「到底又怎麼了」。\n\n有時候真的只是想發洩一下。那時候我需要的不是答案，只是有人在旁邊陪著就好。", "care": "你包辦了絕大部分的家事，雖然有時候是邊做邊唸。\n\n因為初期我胃口不好，只要我有想吃的東西，你都會變出來給我。\n\n還會在我睡覺的時候默默煮好飯，把碗盤都整理好。"}, {"sour": "你是很顧小孩，但莫名的，我好像排在很後面。\n\n我身體不舒服，你聽過就忘了；孩子不舒服，你就記得很清楚。\n\n有時候真的累到不行，會很希望，也有人問一句，媽媽還好嗎。", "care": "不曉得是不是直男的關係，一定要講得很明白，說我心裡不舒服了、身體哪裡不舒服了，你才會意會到，原來我是需要被幫助的。\n\n想對你說的話：感謝你顧小孩顧得很認真。"}, {"sour": "我們是遠距離夫妻。\n\n懷老二以前，不論你在不在，老大的任何事情都是我。", "care": "我抱怨的地方，我發現你默默地改變了。\n\n也開始有些事情不是一個指令一個動作，你會主動想一下可以怎麼幫忙。"}, {"sour": "有小孩之後你的壓力也越來越大。下班回家看到家裡沒收拾，就會問為什麼沒做好，然後唸一串。\n\n我說，我是在完全沒有後援的情況下一個人帶孩子。\n\n你說你不是在指責，是希望我想想時間有沒有更好的安排。又說，如果什麼都要先被同理才能做事，是不是很難進步？而且你也有壓力，那誰又來同理你？\n\n討論完，我其實也同意你。只是心裡還是有一塊，放不下來。", "care": "前陣子顧小孩不順利，晚餐常常要八九點才吃得到，我也幾乎沒有自己的時間。\n\n你默默地把早上的鬧鐘調成四點半，一早起來先把晚餐煮好冰起來，也把一些家事做好，這樣我白天帶小孩就能更順暢。\n\n我雖然也覺得自責，沒能做好，但我真的很感謝你的付出。\n\n很多時候，你都是為我著想的。"}, {"sour": "隊友永遠都在問小孩的東西放哪裡。\n\n有時候真覺得，我是不是多帶了一個孩子。\n\n不過他問，至少表示他想做。", "care": "在懷孕期間，你幾乎天天幫我洗頭，包辦家裡的各項家事。\n\n想謝謝我的神隊友，雖然你常常少根筋，但在產後努力幫忙育兒。\n\n產後憂鬱沒有影響我太多，真的要歸功於你。"}, {"sour": "懷著老二的我，除了照顧老大，也想考個證照為以後鋪路，常常累到下班就整個癱掉。\n\n但你覺得我陪老大睡就一路睡下去，說好要運動也沒做到。\n\n某個假日折騰了一整天，我醒來看見你悠哉地吃著水果看電視。\n\n那一刻我真的很難過，不是因為水果，是因為那時候我好希望有人想到我。", "care": "這位老實的隊友，會接下早上的泡奶工作、晚上一起洗孩子的髒衣服。\n\n偶爾我說要喝什麼、吃什麼，你會直接買回來給我，雖然願望不會很常實現。\n\n很感謝你常常扛起這些照顧孩子的日常。\n\n這個角度看來，是盡責的好隊友。"}, {"sour": "因為工作和經濟壓力，你沒辦法陪我來產檢。\n\n有時候看著診間外，那些有先生陪著、臉上帶著笑的孕媽咪，難免會羨慕。\n\n但我又告訴自己要加油，因為你也很辛苦。\n\n只是有些時候，心裡的那個小小的失落還是會贏。", "care": "雖然你沒辦法每次陪我去產檢，但每天看著你早出晚歸，還是會很心疼。\n\n為了我們的小家，你花了很多心力，努力賺錢讓我跟寶寶能有更好的生活，甚至把錢都給我打理。\n\n我想吃想買的東西，你鮮少拒絕過，幾乎把最好的都給我。\n\n謝謝我的隊友、我的老公，辛苦了。能當你的老婆，我很幸運。"}, {"sour": "孩子吵鬧的時候，你沒有先問發生什麼事，就直接罵了他。\n\n他那時候是真的害怕。\n\n我知道你也是急了。只是他還那麼小。", "care": "孩子開始會頂嘴、用詞不當，聽在你耳裡就覺得不禮貌、不尊重。\n\n很感謝你不想讓孩子騎到我頭上來。\n\n但是可以換個方式慢慢跟他們說，畢竟他們都還不懂。"}];

(function(){
  var sky=document.getElementById('stars');
  for(var i=0;i<40;i++){
    var s=document.createElement('div');
    s.className='star';
    var z=Math.random()*2+1;
    s.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*4.5)+'s';
    sky.appendChild(s);
  }

  var wall=document.getElementById('wall');
  var ov=document.getElementById('ov');
  var card=document.getElementById('card');
  var fr=document.getElementById('fr');
  var bk=document.getElementById('bk');
  var flipBtn=document.getElementById('flipBtn');

  var seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}

  var COLS=8, ROWS=4;

  function openCard(idx){
    card.classList.remove('flipped');
    fr.textContent=P[idx].sour||'';
    bk.textContent=P[idx].care||'';
    flipBtn.textContent='翻到背面';
    ov.classList.add('on');
    fr.parentNode.scrollTop=0; bk.parentNode.scrollTop=0;
  }
  function closeCard(){ov.classList.remove('on');}

  P.forEach(function(p,i){
    var b=document.createElement('button');
    b.className='note';
    b.setAttribute('aria-label','打開這張便條紙');
    var col=i%COLS, row=Math.floor(i/COLS);
    var w=11.2+rnd()*1.6, h=20+rnd()*4;
    var left=col*(100/COLS)+(rnd()*3.2-1.2);
    var top=row*(100/ROWS)+(rnd()*4-1.5);
    var rot=rnd()*7-3.5;
    left=Math.max(0,Math.min(left,100-w));
    top=Math.max(0,Math.min(top,100-h));
    b.style.cssText='left:'+left+'%;top:'+top+'%;width:'+w+'%;height:'+h+'%;transform:rotate('+rot+'deg);z-index:'+i;
    var tape=document.createElement('div');
    tape.className='tape';
    var sp=document.createElement('span');
    sp.textContent=H[i]||(p.sour||p.care||'').split('\n')[0];
    b.appendChild(tape);
    b.appendChild(sp);
    b.addEventListener('click',function(){openCard(i);});
    wall.appendChild(b);
  });

  // ── 瀏覽人次：把下面換成你 Apps Script 部署後的 /exec 網址 ──
  var API='https://script.google.com/macros/s/AKfycbzLc6-GJktSr0CBS8dgZg0O_oRAIR13h5T1Q3QMqggfXcCjruPPhC4Zyenfl5xcYyUb/exec';

  var counterEl=document.getElementById('counter');
  fetch(API)
    .then(function(r){return r.json();})
    .then(function(d){
      counterEl.textContent='這些真心話，已經被看見 '+d.n.toLocaleString('en-US')+' 次';
      counterEl.classList.add('show');
    })
    .catch(function(){
      counterEl.textContent='這些真心話，等著被看見';
      counterEl.classList.remove('show');
    });

  flipBtn.addEventListener('click',function(){
    card.classList.toggle('flipped');
    fr.parentNode.scrollTop=0; bk.parentNode.scrollTop=0;
    flipBtn.textContent=card.classList.contains('flipped')?'翻回正面':'翻到背面';
  });

  document.getElementById('closeBtn').addEventListener('click',closeCard);
  ov.addEventListener('click',function(e){if(e.target===ov)closeCard();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCard();});
})();
</script>
</body>
